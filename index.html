<style>
:root{--preto:#111;--laranja:#f26a1b;--laranja-esc:#d9560d;--fonte:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--preto) radial-gradient(ellipse 90% 45% at 50% 0,rgba(242,106,27,.28),transparent 70%) no-repeat;color:#fff;font-family:var(--fonte);
  padding:max(28px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(34px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
main{max-width:460px;margin:0 auto;text-align:center}
.logo{width:min(250px,68vw);height:auto;margin:6px auto 14px;display:block}
.sub{margin:0 auto 24px;max-width:340px;color:#cfcfcf;font-weight:700;font-size:15.5px;line-height:1.4}
.sub b{color:#fff}
a.l{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;margin:0 0 12px;border-radius:18px;text-decoration:none;font-weight:900;font-size:16.5px;text-align:left;color:#fff;
  background:#1d1d1d;border:1.5px solid #2c2c2c;transition:transform .12s,background .15s,border-color .15s}
a.l:active{transform:scale(.98)}
a.l:hover{border-color:#444;background:#232323}
a.l .t{flex:1;min-width:0;line-height:1.15}
a.l .t small{display:block;margin-top:2px;font-weight:700;font-size:12.5px;color:#a9a9a9}
a.l .ar{flex:0 0 auto;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
a.l img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#333}
a.main{background:linear-gradient(120deg,#f26a1b,#ff8a3d);border:0;min-height:68px;font-size:18px;box-shadow:0 10px 26px rgba(242,106,27,.38)}
a.main:hover{background:linear-gradient(120deg,#f26a1b,#ff8a3d);filter:brightness(1.05)}
a.main .t small{color:rgba(255,255,255,.9)}
a.wa{background:#1f9d55;border:0}
a.wa:hover{background:#23a95c}
a.wa .t small{color:rgba(255,255,255,.88)}
.ic{flex:0 0 auto;width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:26px 0 12px;font-size:12.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#9a9a9a}
.rodape{margin-top:30px;color:#8d8d8d;font-weight:800;font-size:13px}
